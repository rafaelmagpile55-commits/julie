<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 360px;
      width: 90%;
    }

    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #333;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 5px;
      transition: 0.3s;
    }

    #yes {
      background: #e63946;
      color: white;
    }

    #yes:hover {
      background: #d62828;
    }

    #no {
      background: #ccc;
    }

    #message {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: #e63946;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Hey pretty ❤️</h1>
    <p>Will you be my Valentine, <strong>Juliebabes</strong>? 💖</p>

    <button id="yes" onclick="sayYes()">Yes 💕</button>
    <button id="no" onclick="sayNo()">No 🙃</button>

    <div id="message"></div>
  </div>

  <script>
    let noCount = 0;

    function sayYes() {
      const message = document.getElementById("message");
      message.style.display = "block";
      message.textContent = "Let’s goooo 🚀💘";
      noCount = 0;
    }

    function sayNo() {
      const message = document.getElementById("message");
      message.style.display = "block";
      noCount++;

      if (noCount === 1) {
        message.textContent = "iiyak ako 😢";
      } else {
        message.textContent = "hindi tayo bati 😤";
      }
    }
  </script>

</body>
</html>
